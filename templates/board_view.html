<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖥️ SMART BOARD & PPT MODE - {{ topic.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ 
            startOnLoad: true, 
            theme: 'default',
            fontFamily: 'Inter',
            themeVariables: {
                fontSize: '18px'
            }
        });
    </script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --primary-accent: #2563eb;
            --code-bg: #0f172a;
            --code-text: #f8fafc;
            --base-font-size: 19px;
        }

        /* High Contrast Dark / Chalkboard Mode */
        body.dark-board {
            --bg-color: #0b1120;
            --text-color: #f1f5f9;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary-accent: #38bdf8;
            --code-bg: #030712;
            --code-text: #38bdf8;
        }

        body.green-chalkboard {
            --bg-color: #064e3b;
            --text-color: #f0fdf4;
            --card-bg: #065f46;
            --border-color: #047857;
            --primary-accent: #34d399;
            --code-bg: #022c22;
            --code-text: #a7f3d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--base-font-size);
            line-height: 1.75;
            transition: background-color 0.3s, color 0.3s;
            padding-bottom: 80px;
        }

        /* Floating Presenter Control Bar */
        .presenter-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-bottom: 2px solid #3b82f6;
        }

        .presenter-bar .title-tag {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #60a5fa;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-ctrl {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-ctrl:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            transform: translateY(-1px);
        }

        .btn-ctrl.active {
            background: #2563eb;
            color: white;
        }

        /* Main Board Container */
        .board-container {
            max-width: 1400px;
            margin: 90px auto 40px auto;
            padding: 0 30px;
        }

        /* Presentation Cards & Sections */
        .concept-section {
            background: var(--card-bg) !important;
            color: var(--text-color) !important;
            border-color: var(--border-color) !important;
            border-radius: 16px !important;
            padding: 35px !important;
            margin-bottom: 40px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06) !important;
            border: 2px solid var(--border-color) !important;
            scroll-margin-top: 100px;
        }

        .concept-section h2 {
            font-size: 2rem !important;
            margin-bottom: 20px !important;
        }

        .concept-section p, .concept-section li {
            font-size: 1.15rem !important;
            line-height: 1.8 !important;
        }

        /* High Visibility Code Blocks for Board */
        pre {
            background: var(--code-bg) !important;
            color: var(--code-text) !important;
            padding: 22px !important;
            border-radius: 12px !important;
            font-size: 1.1rem !important;
            line-height: 1.6 !important;
            font-family: 'Fira Code', monospace !important;
            border: 2px solid #334155 !important;
            margin: 20px 0 !important;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2) !important;
            overflow-x: auto;
        }

        /* Board Tables */
        table {
            font-size: 1.1rem !important;
            border-collapse: collapse;
            margin: 25px 0;
            width: 100%;
        }

        th, td {
            padding: 16px 20px !important;
        }

        /* Slide Navigation Footer */
        .slide-nav-footer {
            position: fixed;
            bottom: 20px;
            right: 30px;
            display: flex;
            gap: 12px;
            z-index: 999;
        }

        .slide-btn {
            background: #2563eb;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(37,99,235,0.4);
            transition: all 0.2s;
        }

        .slide-btn:hover {
            transform: scale(1.1);
            background: #1d4ed8;
        }

        @media print {
            .presenter-bar, .slide-nav-footer {
                display: none !important;
            }
            .board-container {
                margin: 20px auto !important;
            }
        }
    </style>
</head>
<body>
    <!-- Presenter Control Bar -->
    <div class="presenter-bar">
        <div class="title-tag">
            <span>🖥️ Smart Board / PPT Mode</span>
            <span style="color: #94a3b8; font-weight: normal;">| {{ course_title }}</span>
        </div>

        <div class="controls-group">
            <!-- Theme Selectors -->
            <button class="btn-ctrl" onclick="setTheme('light')" id="btn-theme-light">☀️ Light</button>
            <button class="btn-ctrl" onclick="setTheme('dark')" id="btn-theme-dark">🌙 Dark Board</button>
            <button class="btn-ctrl" onclick="setTheme('chalkboard')" id="btn-theme-green">🍏 Chalkboard</button>

            <!-- Font Size Scalers -->
            <button class="btn-ctrl" onclick="adjustFont(-2)" title="Decrease Font">A-</button>
            <button class="btn-ctrl" onclick="adjustFont(2)" title="Increase Font">A+</button>
            <button class="btn-ctrl" onclick="resetFont()" title="Reset Font">Reset</button>

            <!-- Fullscreen -->
            <button class="btn-ctrl" onclick="toggleFullScreen()">⛶ Fullscreen</button>

            <!-- Print / PDF -->
            <button class="btn-ctrl" onclick="window.print()">🖨️ Print / PDF</button>

            <!-- Exit Board Mode -->
            <a href="{{ url_for('topic', subject=subject, slug=topic.slug) }}" class="btn-ctrl" style="background: #dc2626; border-color: #dc2626;">❌ Exit Board</a>
        </div>
    </div>

    <!-- Board Main Content -->
    <div class="board-container" id="board-content">
        {{ topic.content | safe }}
    </div>

    <!-- Slide Jump Navigation Footer -->
    <div class="slide-nav-footer">
        <button class="slide-btn" onclick="navigateSection(-1)" title="Previous Section (Left Arrow)">◀</button>
        <button class="slide-btn" onclick="navigateSection(1)" title="Next Section (Right Arrow)">▶</button>
    </div>

    <script>
        let currentSectionIndex = 0;
        let sections = [];
        let currentFontSize = 19;

        document.addEventListener('DOMContentLoaded', () => {
            sections = Array.from(document.querySelectorAll('.concept-section'));
            
            // Listen for Arrow Keys navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                    navigateSection(1);
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    navigateSection(-1);
                } else if (e.key.toLowerCase() === 'f') {
                    toggleFullScreen();
                }
            });
        });

        function navigateSection(direction) {
            if (!sections.length) return;
            currentSectionIndex += direction;
            if (currentSectionIndex < 0) currentSectionIndex = 0;
            if (currentSectionIndex >= sections.length) currentSectionIndex = sections.length - 1;

            sections[currentSectionIndex].scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }

        function setTheme(theme) {
            document.body.classList.remove('dark-board', 'green-chalkboard');
            if (theme === 'dark') {
                document.body.classList.add('dark-board');
            } else if (theme === 'chalkboard') {
                document.body.classList.add('green-chalkboard');
            }
        }

        function adjustFont(delta) {
            currentFontSize = Math.max(14, Math.min(32, currentFontSize + delta));
            document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
        }

        function resetFont() {
            currentFontSize = 19;
            document.documentElement.style.setProperty('--base-font-size', '19px');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
